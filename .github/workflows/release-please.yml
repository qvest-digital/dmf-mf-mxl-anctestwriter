name: release-please

# Conventional commits drive the version. Merging the PR release-please opens cuts
# a vN tag, writes CHANGELOG.md and publishes a GitHub release -- and that
# published release is what build.yml tags an image with, so the image and the
# release always carry the same version.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
